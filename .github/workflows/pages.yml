name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          cp 20.html 60.html index.html _site/
          cp -R css js slides images demo cut-20 _site/
          touch _site/.nojekyll

      - name: Strip speaker notes
        run: |
          find _site/slides _site/cut-20/slides -name '*.html' -print0 \
            | xargs -0 perl -0pi -e 's{[ \t]*<aside class="notes">.*?</aside>[ \t]*\n?}{}gs'
          if grep -rl 'class="notes"' _site; then
            echo "Speaker notes still present in the files above" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
